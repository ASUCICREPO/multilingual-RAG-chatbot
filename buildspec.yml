version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing AWS CDK CLI..."
      - npm install -g aws-cdk
      - echo "Installing zip utility for frontend..."
      - yum install -y zip

  pre_build:
    commands:
      - echo "=== BACKEND DEPLOYMENT ==="
      - echo "Changing into backend directory"
      - cd backend
      - echo "Installing backend dependencies..."
      - npm ci
      - echo "Bootstrapping CDK..."
      - cdk bootstrap --require-approval never --context amplifyAppId=$AMPLIFY_APP_ID

  build:
    commands:
      - echo "Deploying CDK stack..."
      - cdk deploy --require-approval never --context amplifyAppId=$AMPLIFY_APP_ID
      - echo "CDK deployment complete."
      - echo "Extracting API Gateway URL and Cognito details..."
      - cd ..
      - export API_GATEWAY_URL=$(aws cloudformation describe-stacks --stack-name BedrockChatbotBackendStack --query 'Stacks[0].Outputs[?OutputKey==`HttpApiUrl`].OutputValue' --output text --region $AWS_DEFAULT_REGION)
      - export USER_POOL_ID=$(aws cloudformation describe-stacks --stack-name BedrockChatbotBackendStack --query 'Stacks[0].Outputs[?OutputKey==`UserPoolId`].OutputValue' --output text --region $AWS_DEFAULT_REGION)
      - export USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks --stack-name BedrockChatbotBackendStack --query 'Stacks[0].Outputs[?OutputKey==`UserPoolClientId`].OutputValue' --output text --region $AWS_DEFAULT_REGION)
      - echo "API Gateway URL=$API_GATEWAY_URL"
      - echo "User Pool ID=$USER_POOL_ID"
      - echo "User Pool Client ID=$USER_POOL_CLIENT_ID"
      - echo ""
      - echo "=== FRONTEND DEPLOYMENT ==="
      - cd frontend
      - echo "Installing frontend dependencies..."
      - npm ci
      - echo "Creating .env.local with backend configuration..."
      - |
        cat > .env.local << EOF
        NEXT_PUBLIC_API_BASE_URL=$API_GATEWAY_URL
        NEXT_PUBLIC_COGNITO_USER_POOL_ID=$USER_POOL_ID
        NEXT_PUBLIC_COGNITO_CLIENT_ID=$USER_POOL_CLIENT_ID
        NEXT_PUBLIC_COGNITO_REGION=$AWS_DEFAULT_REGION
        EOF
      - cat .env.local
      - echo "Building Next.js application..."
      - npm run build
      - echo "Creating deployment package..."
      - cd out && zip -r build.zip .

  post_build:
    commands:
      - echo "Setting test user password..."
      - aws cognito-idp admin-set-user-password --user-pool-id $USER_POOL_ID --username testuser --password "$TEST_USER_PASSWORD" --permanent --region $AWS_DEFAULT_REGION || echo "Test user password already set or user doesn't exist"
      - echo "Deploying frontend to Amplify..."
      - cd ..
      - aws amplify create-deployment --app-id $AMPLIFY_APP_ID --branch-name main --region $AWS_DEFAULT_REGION --output json > deployment_response.json
      - echo "Extracting upload URL and job ID..."
      - export UPLOAD_URL=$(node -e "const data=require('./deployment_response.json'); console.log(data.zipUploadUrl)")
      - export JOB_ID=$(node -e "const data=require('./deployment_response.json'); console.log(data.jobId)")
      - cd out
      - curl -X PUT -T build.zip "$UPLOAD_URL"
      - echo "Starting deployment..."
      - aws amplify start-deployment --app-id $AMPLIFY_APP_ID --branch-name main --job-id $JOB_ID --region $AWS_DEFAULT_REGION
      - echo "Frontend deployment completed successfully!"
